<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Menu Famiglia - Pianificatore Settimanale</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Organizza il menu settimanale e genera la lista della spesa automaticamente">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #1a1a2e;
            --dark-alt: #16213e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --success: #06ffa5;
            --card-bg: #252544;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Karla', sans-serif;
            background: var(--dark);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: 80px;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.03;
            background-image: 
                radial-gradient(circle at 20% 50%, var(--primary) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, var(--secondary) 0%, transparent 50%),
                radial-gradient(circle at 40% 90%, var(--accent) 0%, transparent 50%);
            filter: blur(60px);
            animation: morph 20s ease-in-out infinite;
        }

        @keyframes morph {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }

        .header h1 {
            font-family: 'Righteous', cursive;
            font-size: clamp(2rem, 8vw, 3.5rem);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header p {
            color: var(--text-muted);
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            animation: fadeInUp 0.8s ease-out 0.2s both;
            padding: 0 10px;
        }

        .header .powered-by {
            margin-top: 10px;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            color: var(--text-muted);
            opacity: 0.6;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .header .powered-by a {
            color: var(--secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .header .powered-by a:hover {
            color: var(--accent);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--dark-alt);
            padding: 6px;
            border-radius: 20px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-tab {
            flex: 1;
            min-width: 100px;
            padding: 12px 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Karla', sans-serif;
            font-weight: 600;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .nav-tab span {
            position: relative;
            z-index: 1;
        }

        .nav-tab.active {
            color: var(--text);
        }

        .nav-tab.active::before {
            opacity: 1;
        }

        .nav-tab:hover:not(.active) {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .day-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            box-shadow: 0 12px 40px rgba(78, 205, 196, 0.2);
        }

        .day-card h3 {
            font-family: 'Righteous', cursive;
            font-size: 1.4rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .meal-section {
            margin-bottom: 15px;
        }

        .meal-section:last-child {
            margin-bottom: 0;
        }

        .meal-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .meal-input {
            width: 100%;
            padding: 12px 15px;
            background: var(--dark-alt);
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--text);
            font-family: 'Karla', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .meal-input:focus {
            border-color: var(--secondary);
            background: var(--dark);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }

        .meal-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .shopping-list {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .add-item-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .add-item-form input {
            flex: 1;
            padding: 14px 18px;
            background: var(--dark-alt);
            border: 2px solid transparent;
            border-radius: 15px;
            color: var(--text);
            font-family: 'Karla', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .add-item-form input:focus {
            border-color: var(--accent);
            background: var(--dark);
            box-shadow: 0 0 0 4px rgba(255, 230, 109, 0.1);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 15px;
            font-family: 'Karla', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #ff8787);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #6fe9de);
            color: var(--dark);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(78, 205, 196, 0.4);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #fff89a);
            color: var(--dark);
        }

        .btn-accent:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 230, 109, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .shopping-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: var(--dark-alt);
            border-radius: 12px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .shopping-item:hover {
            border-color: var(--secondary);
            transform: translateX(5px);
        }

        .shopping-item.checked {
            opacity: 0.5;
        }

        .shopping-item.checked .item-text {
            text-decoration: line-through;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox.checked::after {
            content: '✓';
            color: var(--dark);
            font-weight: bold;
            font-size: 16px;
        }

        .item-text {
            flex: 1;
            font-size: 1rem;
            color: var(--text);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .delete-btn:hover {
            opacity: 1;
            background: rgba(255, 107, 107, 0.1);
            transform: scale(1.1);
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 25px 0;
            justify-content: center;
        }

        .action-buttons .btn {
            flex: 1;
            min-width: 150px;
        }

        .members-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .members-section h3 {
            font-family: 'Righteous', cursive;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .member-card {
            background: var(--dark-alt);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .member-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .member-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .member-role {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .member-role.creator {
            color: var(--accent);
        }

        .family-info {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .family-code {
            font-family: 'Righteous', cursive;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
            letter-spacing: 3px;
        }

        .setup-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .setup-content {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(78, 205, 196, 0.2);
        }

        .setup-content h2 {
            font-family: 'Righteous', cursive;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .setup-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .setup-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .setup-form input {
            padding: 15px 20px;
            background: var(--dark-alt);
            border: 2px solid transparent;
            border-radius: 15px;
            color: var(--text);
            font-family: 'Karla', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .setup-form input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(78, 205, 196, 0.2);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--dark-alt);
        }

        .modal-header h3 {
            font-family: 'Righteous', cursive;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            color: var(--primary);
            transform: rotate(90deg);
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .template-card {
            background: var(--dark-alt);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .template-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 230, 109, 0.2);
        }

        .template-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .template-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .template-date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .template-actions {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 8px;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .icon-btn:hover {
            opacity: 1;
            background: rgba(255, 107, 107, 0.2);
            transform: scale(1.1);
        }

        .save-template-box {
            background: var(--dark-alt);
            padding: 25px;
            border-radius: 15px;
        }

        .qr-container {
            text-align: center;
            padding: 20px;
        }

        .qr-container img {
            max-width: 300px;
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .qr-container p {
            color: var(--text-muted);
            margin: 10px 0;
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .share-btn {
            padding: 12px;
            font-size: 0.9rem;
        }

        .notification-toggle {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .notification-toggle:hover {
            border-color: var(--secondary);
        }

        .notification-info {
            flex: 1;
        }

        .notification-info h4 {
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .notification-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .notification-status {
            margin-top: 10px;
            padding: 10px;
            background: var(--dark-alt);
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: var(--dark-alt);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: var(--success);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: all 0.3s ease;
        }

        .toggle-switch.active::after {
            left: 33px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .btn {
                width: 100%;
            }

            .members-grid {
                grid-template-columns: 1fr;
            }

            .setup-buttons {
                flex-direction: column;
            }

            .template-grid {
                grid-template-columns: 1fr;
            }

            .share-options {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar personalizzata */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-alt);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* Animazione caricamento */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div id="root"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configurazione Firebase
        const firebaseConfig = {

                <div className="container">
                    <div className="header">
                        <h1>🍽️ Menu Famiglia</h1>
                        <p>Organizza il menu settimanale e genera la lista della spesa automaticamente</p>
                        <div className="powered-by">
                            Powered by <a href="https://thesimplecorner.org" target="_blank" rel="noopener noreferrer">TheSimpleCorner</a>
                        </div>
                    </div>

                    {/* Setup Famiglia Modal */}
                    {showFamilySetup && (
                        <div className="setup-modal">
                            <div className="setup-content">
                                <h2>👨‍👩‍👧‍👦 Benvenuto!</h2>
                                
                                {!setupMode && (
                                    <div className="setup-buttons">
                                        <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => setSetupMode('create')}>
                                            <span>Crea Famiglia</span>
                                        </button>
                                        <button className="btn btn-secondary" style={{ flex: 1 }} onClick={() => setSetupMode('join')}>
                                            <span>Unisciti</span>
                                        </button>
                                    </div>
                                )}

                                {setupMode === 'create' && (
                                    <div className="setup-form">
                                        <input
                                            type="text"
                                            placeholder="Il tuo nome"
                                            value={inputName}
                                            onChange={(e) => setInputName(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && createFamily()}
                                        />
                                        <button className="btn btn-primary" onClick={createFamily}>
                                            <span>Crea Famiglia</span>
                                        </button>
                                        <button className="btn btn-outline" onClick={() => setSetupMode('')}>
                                            <span>Indietro</span>
                                        </button>
                                    </div>
                                )}

                                {setupMode === 'join' && (
                                    <div className="setup-form">
                                        <input
                                            type="text"
                                            placeholder="Codice Famiglia"
                                            value={inputCode}
                                            onChange={(e) => setInputCode(e.target.value)}
                                        />
                                        <input
                                            type="text"
                                            placeholder="Il tuo nome"
                                            value={inputName}
                                            onChange={(e) => setInputName(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && joinFamily()}
                                        />
                                        <button className="btn btn-secondary" onClick={joinFamily}>
                                            <span>Unisciti</span>
                                        </button>
                                        <button className="btn btn-outline" onClick={() => setSetupMode('')}>
                                            <span>Indietro</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    {!showFamilySetup && (
                        <>
                            <div className="nav-tabs">
                                <button 
                                    className={`nav-tab ${activeTab === 'menu' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('menu')}
                                >
                                    <span>📅 Menu</span>
                                </button>
                                <button 
                                    className={`nav-tab ${activeTab === 'shopping' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('shopping')}
                                >
                                    <span>🛒 Spesa</span>
                                </button>
                                <button 
                                    className={`nav-tab ${activeTab === 'family' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('family')}
                                >
                                    <span>👥 Famiglia</span>
                                </button>
                            </div>

                            {/* Tab Menu */}
                            <div className={`tab-content ${activeTab === 'menu' ? 'active' : ''}`}>
                                <div className="action-buttons">
                                    <button className="btn btn-primary" onClick={generateShoppingList}>
                                        <span>📝 Genera Lista Spesa</span>
                                    </button>
                                    <button className="btn btn-secondary" onClick={() => setShowSaveMenuModal(true)}>
                                        <span>💾 Salva Menu</span>
                                    </button>
                                    <button className="btn btn-accent" onClick={() => setShowLoadMenuModal(true)}>
                                        <span>📂 Carica Menu</span>
                                    </button>
                                    <button className="btn btn-outline" onClick={clearMenu}>
                                        <span>🗑️ Pulisci</span>
                                    </button>
                                </div>

                                <div className="action-buttons">
                                    <button className="btn btn-secondary" onClick={() => shareOnWhatsApp('menu')}>
                                        <span>💬 WhatsApp</span>
                                    </button>
                                    <button className="btn btn-accent" onClick={() => copyToClipboard('menu')}>
                                        <span>📋 Copia</span>
                                    </button>
                                    <button className="btn btn-primary" onClick={() => downloadAsFile('menu')}>
                                        <span>📥 Scarica</span>
                                    </button>
                                </div>

                                <div className="menu-grid">
                                    {daysOfWeek.map(day => (
                                        <div key={day} className="day-card">
                                            <h3>{day}</h3>
                                            <div className="meal-section">
                                                <div className="meal-label">
                                                    🌞 Pranzo
                                                </div>
                                                <input
                                                    type="text"
                                                    className="meal-input"
                                                    placeholder="Es: Pasta al pomodoro"
                                                    value={weekMenu[day]?.lunch || ''}
                                                    onChange={(e) => updateMeal(day, 'lunch', e.target.value)}
                                                />
                                            </div>
                                            <div className="meal-section">
                                                <div className="meal-label">
                                                    🌙 Cena
                                                </div>
                                                <input
                                                    type="text"
                                                    className="meal-input"
                                                    placeholder="Es: Pizza margherita"
                                                    value={weekMenu[day]?.dinner || ''}
                                                    onChange={(e) => updateMeal(day, 'dinner', e.target.value)}
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Tab Shopping */}
                            <div className={`tab-content ${activeTab === 'shopping' ? 'active' : ''}`}>
                                <div className="shopping-list">
                                    <div className="action-buttons">
                                        <button className="btn btn-secondary" onClick={() => setShowSaveListModal(true)}>
                                            <span>💾 Salva Lista</span>
                                        </button>
                                        <button className="btn btn-accent" onClick={() => setShowLoadListModal(true)}>
                                            <span>📂 Carica Lista</span>
                                        </button>
                                        <button className="btn btn-outline" onClick={clearShoppingList}>
                                            <span>🗑️ Pulisci</span>
                                        </button>
                                    </div>

                                    <div className="action-buttons">
                                        <button className="btn btn-secondary" onClick={() => shareOnWhatsApp('shopping')}>
                                            <span>💬 WhatsApp</span>
                                        </button>
                                        <button className="btn btn-accent" onClick={() => copyToClipboard('shopping')}>
                                            <span>📋 Copia</span>
                                        </button>
                                        <button className="btn btn-primary" onClick={() => downloadAsFile('shopping')}>
                                            <span>📥 Scarica</span>
                                        </button>
                                    </div>

                                    <div className="add-item-form">
                                        <input
                                            type="text"
                                            placeholder="Aggiungi prodotto..."
                                            value={newItem}
                                            onChange={(e) => setNewItem(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && addItem()}
                                        />
                                        <button className="btn btn-primary" onClick={addItem}>
                                            <span>+</span>
                                        </button>
                                    </div>

                                    <div className="shopping-items">
                                        {shoppingList.length === 0 ? (
                                            <p style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '40px 20px' }}>
                                                Nessun prodotto nella lista. Aggiungi manualmente o genera dalla sezione Menu!
                                            </p>
                                        ) : (
                                            shoppingList.map(item => (
                                                <div key={item.id} className={`shopping-item ${item.checked ? 'checked' : ''}`}>
                                                    <div 
                                                        className={`checkbox ${item.checked ? 'checked' : ''}`}
                                                        onClick={() => toggleItem(item.id)}
                                                    ></div>
                                                    <span className="item-text">{item.name}</span>
                                                    <button className="delete-btn" onClick={() => deleteItem(item.id)}>
                                                        🗑️
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Tab Family */}
                            <div className={`tab-content ${activeTab === 'family' ? 'active' : ''}`}>
                                <div className="family-info">
                                    <h3>Codice Famiglia</h3>
                                    <div className="family-code">{familyCode}</div>
                                    <p style={{ color: 'var(--text-muted)', marginBottom: '20px' }}>
                                        Condividi questo codice con i tuoi familiari
                                    </p>
                                    <button className="btn btn-primary" onClick={showQRCode}>
                                        <span>📱 Mostra QR Code</span>
                                    </button>
                                </div>

                                {/* Notifiche Toggle */}
                                <div className="notification-toggle">
                                    <div className="notification-info">
                                        <h4>🔔 Notifiche Push</h4>
                                        <p>Ricevi aggiornamenti in tempo reale</p>
                                    </div>
                                    <div 
                                        className={`toggle-switch ${notificationsEnabled ? 'active' : ''}`}
                                        onClick={toggleNotifications}
                                    ></div>
                                </div>

                                {notificationStatus && (
                                    <div className="notification-status">
                                        {notificationStatus}
                                    </div>
                                )}

                                {notificationsEnabled && (
                                    <div style={{ textAlign: 'center', marginTop: '15px' }}>
                                        <button className="btn btn-outline" onClick={sendTestNotification}>
                                            <span>📬 Invia Notifica di Test</span>
                                        </button>
                                    </div>
                                )}

                                {/* Membri */}
                                <div className="members-section">
                                    <h3>👥 Membri della Famiglia</h3>
                                    <div className="members-grid">
                                        {Object.entries(members).map(([uid, member]) => (
                                            <div key={uid} className="member-card">
                                                <div className="member-name">{member.name}</div>
                                                <div className={`member-role ${member.role}`}>
                                                    {member.role === 'creator' ? '👑 Creatore' : '👤 Membro'}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div style={{ marginTop: '30px', textAlign: 'center' }}>
                                    <button className="btn btn-outline" onClick={leaveFamily}>
                                        <span>🚪 Esci dalla Famiglia</span>
                                    </button>
                                </div>
                            </div>
                        </>
                    )}

                    {/* Save Menu Modal */}
                    {showSaveMenuModal && (
                        <div className="modal" onClick={() => setShowSaveMenuModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>💾 Salva Menu</h3>
                                    <button className="close-btn" onClick={() => setShowSaveMenuModal(false)}>✕</button>
                                </div>
                                <div className="save-template-box">
                                    <p style={{ marginBottom: '15px', color: 'var(--text-muted)' }}>
                                        Dai un nome al tuo menu settimanale
                                    </p>
                                    <input
                                        type="text"
                                        className="meal-input"
                                        placeholder="Es: Menu Gennaio, Menu Festivo..."
                                        value={templateName}
                                        onChange={(e) => setTemplateName(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && saveMenu()}
                                        autoFocus
                                    />
                                    <button 
                                        className="btn btn-primary" 
                                        style={{ width: '100%', marginTop: '15px' }}
                                        onClick={saveMenu}
                                    >
                                        💾 Salva
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Load Menu Modal */}
                    {showLoadMenuModal && (
                        <div className="modal" onClick={() => setShowLoadMenuModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>📂 Carica Menu</h3>
                                    <button className="close-btn" onClick={() => setShowLoadMenuModal(false)}>✕</button>
                                </div>
                                {savedMenus.length === 0 ? (
                                    <p style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '30px' }}>
                                        Nessun menu salvato ancora
                                    </p>
                                ) : (
                                    <div className="template-grid">
                                        {savedMenus.map(menu => (
                                            <div key={menu.id} className="template-card" onClick={() => loadMenu(menu.id)}>
                                                <div className="template-header">
                                                    <div>
                                                        <div className="template-name">{menu.name}</div>
                                                        <div className="template-date">
                                                            {new Date(menu.createdAt).toLocaleDateString('it-IT')}
                                                        </div>
                                                    </div>
                                                    <div className="template-actions">
                                                        <button 
                                                            className="icon-btn" 
                                                            onClick={(e) => { e.stopPropagation(); deleteMenu(menu.id); }}
                                                        >
                                                            🗑️
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Save Shopping List Modal */}
                    {showSaveListModal && (
                        <div className="modal" onClick={() => setShowSaveListModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>💾 Salva Lista</h3>
                                    <button className="close-btn" onClick={() => setShowSaveListModal(false)}>✕</button>
                                </div>
                                <div className="save-template-box">
                                    <p style={{ marginBottom: '15px', color: 'var(--text-muted)' }}>
                                        Dai un nome alla tua lista della spesa
                                    </p>
                                    <input
                                        type="text"
                                        className="meal-input"
                                        placeholder="Es: Spesa Mensile, Lista Base..."
                                        value={templateName}
                                        onChange={(e) => setTemplateName(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && saveShoppingList()}
                                        autoFocus
                                    />
                                    <button 
                                        className="btn btn-primary" 
                                        style={{ width: '100%', marginTop: '15px' }}
                                        onClick={saveShoppingList}
                                    >
                                        💾 Salva
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Load Shopping List Modal */}
                    {showLoadListModal && (
                        <div className="modal" onClick={() => setShowLoadListModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>📂 Carica Lista</h3>
                                    <button className="close-btn" onClick={() => setShowLoadListModal(false)}>✕</button>
                                </div>
                                {savedShoppingLists.length === 0 ? (
                                    <p style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '30px' }}>
                                        Nessuna lista salvata ancora
                                    </p>
                                ) : (
                                    <div className="template-grid">
                                        {savedShoppingLists.map(list => (
                                            <div key={list.id} className="template-card" onClick={() => loadShoppingList(list.id)}>
                                                <div className="template-header">
                                                    <div>
                                                        <div className="template-name">{list.name}</div>
                                                        <div className="template-date">
                                                            {new Date(list.createdAt).toLocaleDateString('it-IT')} · {list.list.length} prodotti
                                                        </div>
                                                    </div>
                                                    <div className="template-actions">
                                                        <button 
                                                            className="icon-btn" 
                                                            onClick={(e) => { e.stopPropagation(); deleteShoppingList(list.id); }}
                                                        >
                                                            🗑️
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* QR Code Modal */}
                    {showQRModal && (
                        <div className="modal" onClick={() => setShowQRModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h3>📱 Codice QR</h3>
                                    <button className="close-btn" onClick={() => setShowQRModal(false)}>✕</button>
                                </div>
                                <div className="qr-container">
                                    <img src={qrCodeUrl} alt="QR Code" />
                                    <p>Scansiona per unirti alla famiglia</p>
                                    <p style={{ fontWeight: 'bold', marginTop: '10px' }}>Codice: {familyCode}</p>
                                </div>
                                <div className="share-options">
                                    <button className="btn btn-secondary share-btn" onClick={() => shareQRCode('whatsapp')}>
                                        💬 WhatsApp
                                    </button>
                                    <button className="btn btn-accent share-btn" onClick={() => shareQRCode('copy')}>
                                        📋 Copia Link
                                    </button>
                                    <button className="btn btn-primary share-btn" onClick={() => shareQRCode('download')}>
                                        📥 Scarica QR
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));

        // Registrazione service worker generale (per funzionalità offline/PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/MealPlanner/sw.js', {
                    scope: '/MealPlanner/'
                })
                    .then(reg => console.log('SW generale OK:', reg.scope))
                    .catch(err => console.log('SW Error:', err));
            });
        }
    </script>
</body>
</html>
